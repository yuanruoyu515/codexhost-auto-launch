<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc"><title id="title">CodexHost Auto Launch</title><desc id="desc">Open the official app from the Dock, Finder or Spotlight. Auto Launch hands the cold start to CodexHost. Tabs is an optional companion.</desc><rect width="1600" height="600" rx="24" fill="#111318"/><g font-family="Century Gothic, Arial, sans-serif"><rect x="64" y="67" width="10" height="10" rx="3" fill="#3B82F6"/><text x="87" y="78" font-size="22" fill="#A0A8B8">a macOS companion for CodexHost</text><text x="61" y="186" font-size="76" font-weight="700" letter-spacing="-3" fill="#F5F7FA">CodexHost Auto Launch</text><text x="64" y="248" font-size="29" fill="#A0A8B8">Open from the Dock. CodexHost comes with it.</text><text x="64" y="293" font-family="PingFang SC, sans-serif" font-size="26" fill="#A0A8B8">照常点开 App，自动经由 CodexHost 启动。</text><rect x="64" y="368" width="408" height="152" rx="22" fill="#1C2028" stroke="#343B49"/><circle cx="103" cy="410" r="16" fill="#3B82F6" fill-opacity=".14"/><text x="103" y="416" text-anchor="middle" font-size="17" fill="#3B82F6">1</text><text x="88" y="461" font-size="27" font-weight="700" fill="#F5F7FA">Your app icon</text><text x="88" y="494" font-size="19" fill="#A0A8B8">Dock · Finder · Spotlight</text><rect x="594" y="368" width="408" height="152" rx="22" fill="#1C2028" stroke="#343B49"/><circle cx="633" cy="410" r="16" fill="#3B82F6" fill-opacity=".14"/><text x="633" y="416" text-anchor="middle" font-size="17" fill="#3B82F6">2</text><text x="618" y="461" font-size="27" font-weight="700" fill="#F5F7FA">Auto Launch</text><text x="618" y="494" font-size="19" fill="#A0A8B8">Listens for a cold start</text><rect x="1124" y="368" width="412" height="152" rx="22" fill="#1C2028" stroke="#343B49"/><circle cx="1163" cy="410" r="16" fill="#3B82F6" fill-opacity=".14"/><text x="1163" y="416" text-anchor="middle" font-size="17" fill="#3B82F6">3</text><text x="1148" y="461" font-size="27" font-weight="700" fill="#F5F7FA">CodexHost</text><text x="1148" y="494" font-size="19" fill="#A0A8B8">Your agents + optional Tabs</text><path d="M508 444h44m-12-12 12 12-12 12" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1038 444h44m-12-12 12 12-12 12" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="561" font-size="18" fill="#A0A8B8">Per-user install · Existing sessions stay open · No app bundle edits</text></g></svg>